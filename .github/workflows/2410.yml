name: Auto Package Auto.js Script

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名称'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本号'
        required: true
        default: '1'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查必要文件
        run: |
          if [ ! -f "main.js" ]; then
            echo "错误：main.js 不存在"
            exit 1
          fi

      - name: 生成 project.json（如缺失）
        run: |
          if [ ! -f "project.json" ]; then
            echo '{
  "name": "快手抖音带货助手",
  "versionName": "${{ github.event.inputs.version_name }}",
  "versionCode": ${{ github.event.inputs.version_code }},
  "packageName": "com.yourname.kuaishoubot",
  "main": "main.js"
}' > project.json
          fi

      - name: 更新版本号
        run: |
          sed -i "s/\"versionName\": \".*\"/\"versionName\": \"${{ github.event.inputs.version_name }}\"/" project.json
          sed -i "s/\"versionCode\": .*/\"versionCode\": ${{ github.event.inputs.version_code }},/" project.json

      - name: 打包脚本
        run: |
          mkdir -p release
          cp -r ./* release/ 2>/dev/null || true
          rm -rf release/.git release/.github release/node_modules
          cd release
          zip -r ../kuaishou-bot-v${{ github.event.inputs.version_name }}.zip ./*
          cd ..

      - name: 上传脚本包
        uses: actions/upload-artifact@v4
        with:
          name: kuaishou-bot-v${{ github.event.inputs.version_name }}
          path: kuaishou-bot-v${{ github.event.inputs.version_name }}.zip
