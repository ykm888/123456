name: Auto Fix UI Script

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pycryptodome  # 可选
      - name: Check file existence and content
        run: |
          echo "=== Checking file path ==="
          ls -la clean_resources_output/assets/project/ || echo "Directory not found"
          echo "=== File content preview ==="
          head -n 20 clean_resources_output/assets/project/ui.js || echo "File not found"
      - name: Decrypt and fix ui.js
        run: python decrypt_and_fix_ui.py clean_resources_output/assets/project/ui.js ui_fixed.js
      - name: Replace original ui.js
        run: mv ui_fixed.js clean_resources_output/assets/project/ui.js
      - name: Rebuild APK
        run: |
          apktool b clean_resources_output -o fixed.apk
          zipalign -v -p 4 fixed.apk aligned.apk
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android aligned.apk androiddebugkey
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fixed-apk
          path: aligned.apk
