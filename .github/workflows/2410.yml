name: Fix APK (Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool_2.9.3.jar /usr/local/bin/apktool.jar
          sudo mv apktool /usr/local/bin/apktool
          apktool --version
      - name: Decompile APK
        run: |
          rm -rf clean_resources
          apktool d ha.apk -o clean_resources -f
      - name: Check ui.js exists
        run: |
          if [ ! -f clean_resources/assets/project/ui.js ]; then
            echo "错误：ui.js 不存在，请检查反编译结果"
            exit 1
          fi
      - name: Safe fix ui.js
        run: python3 safe_fix_ui.py clean_resources/assets/project/ui.js
      - name: Rebuild APK
        run: apktool b clean_resources -o unsigned.apk
      - name: Align APK
        run: zipalign -v -p 4 unsigned.apk aligned.apk
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
      - name: Sign APK
        run: jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android aligned.apk androiddebugkey
      - name: Rename final APK
        run: mv aligned.apk final.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: final-apk
          path: final.apk
