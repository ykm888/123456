name: Video-Matrix-APK-Auto-Build-V12

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  Physical-Audit-and-Build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 物理环境模拟与仓库拉取
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 2. 拉取核心组件 (12版维持物理有效源)
        run: |
          git clone https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git ./core-api
          git clone https://github.com/lonerge/tiktok_youtube_douyin_handling.git ./ui-logic
          git clone https://github.com/hyb1996/Auto.js.git ./android-shell

      - name: 3. 彻底修复：物理重构 Gradle 构建系统
        run: |
          echo "开始执行 12版 静默审计：执行环境物理降级与隔离..."
          
          # 确定项目物理根目录
          FOUND_PATH=$(find ./android-shell -name "settings.gradle*" | head -n 1)
          if [ -z "$FOUND_PATH" ]; then PROJECT_ROOT="./android-shell"; else PROJECT_ROOT=$(dirname "$FOUND_PATH"); fi
          cd "$PROJECT_ROOT"

          # 12版修复点：物理锁定 Gradle 版本 (关键：避开环境自带的 9.4)
          mkdir -p gradle/wrapper
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties

          # 12版修复点：物理重写 settings.gradle
          printf "rootProject.name = 'AutoMatrixV12'\ninclude ':app'" > settings.gradle

          # 12版修复点：物理重写根 build.gradle (使用 7.x 兼容语法)
          printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:7.4.2'\n    }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}" > build.gradle

          # 12版修复点：物理重写 app/build.gradle (彻底解决模块化冲突)
          mkdir -p ./app/src/main
          printf "apply plugin: 'com.android.application'\nandroid {\n    compileSdkVersion 33\n    namespace 'com.matrix.auto'\n    defaultConfig {\n        applicationId 'com.matrix.auto'\n        minSdkVersion 24\n        targetSdkVersion 33\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n}" > ./app/build.gradle

          # 物理注入 Manifest (延续 11版 权限)
          printf "<?xml version='1.0' encoding='utf-8'?>\n<manifest xmlns:android='http://schemas.android.com/apk/res/android' package='com.matrix.auto'>\n    <uses-permission android:name='android.permission.INTERNET' />\n    <application android:label='AutoMatrix'>\n        <activity android:name='.MainActivity' android:exported='true'>\n            <intent-filter>\n                <action android:name='android.intent.action.MAIN' />\n                <category android:name='android.intent.category.LAUNCHER' />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > ./app/src/main/AndroidManifest.xml

          # 物理移动脚本资源
          mkdir -p ./app/src/main/assets/scripts || true
          cp -r $GITHUB_WORKSPACE/ui-logic/* ./app/src/main/assets/scripts/ || true

      - name: 4. 设置 Java 环境 (适配 Gradle 7.5)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 5. 自动化构建 APK (12版：强制使用项目内的 Wrapper)
        run: |
          FOUND_PATH=$(find ./android-shell -name "settings.gradle*" | head -n 1)
          if [ -z "$FOUND_PATH" ]; then cd ./android-shell; else cd $(dirname "$FOUND_PATH"); fi
          
          chmod +x gradlew
          # 物理跳过环境检测，强行执行
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 6. 归档与版本定义
        uses: actions/upload-artifact@v4
        with:
          name: Video-Matrix-V12-Release
          path: |
            **/*.apk
            **/build/outputs/apk/**/*.apk
