name: Extract Resources from ha.apk

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool_2.9.3.jar /usr/local/bin/apktool.jar
          sudo mv apktool /usr/local/bin/apktool
          apktool --version

      - name: Decompile ha.apk
        run: |
          # 强制覆盖已有目录
          rm -rf clean_resources
          apktool d ha.apk -o clean_resources -f
          # 验证目录是否生成
          ls -la clean_resources

      - name: Package resources
        run: |
          cd clean_resources
          zip -r ../clean_resources.zip .
          cd ..

      - name: Upload resources artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-resources
          path: clean_resources.zip

