name: Video-Matrix-APK-Auto-Build-V16

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  Physical-Audit-and-Build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 物理环境准备 (16版：初始化 workspace)
        run: |
          mkdir -p workspace/app/src/main/assets/scripts
          echo "16版 物理空间初始化完成。"

      - name: 2. 拉取组件并物理归位 (16版延续逻辑)
        run: |
          git clone https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git ./temp-api
          git clone https://github.com/lonerge/tiktok_youtube_douyin_handling.git ./temp-ui
          git clone https://github.com/hyb1996/Auto.js.git ./temp-shell
          
          # 物理迁移
          cp -r ./temp-shell/. ./workspace/
          cp -r ./temp-ui/* ./workspace/app/src/main/assets/scripts/ || true
          echo "组件物理归位完成。"

      - name: 3. 核心修复：物理重构构建脚本 (16版：适配 AGP 8.2.2)
        run: |
          cd workspace
          # 16版修复点：物理写入 settings.gradle
          printf "rootProject.name = 'AutoMatrixV16'\ninclude ':app'" > settings.gradle

          # 16版修复点：物理写入根 build.gradle (升级插件版本至 8.2.2)
          printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.2.2'\n    }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}" > build.gradle

          # 16版修复点：物理写入 app/build.gradle (改用 plugins 闭包以增强兼容性)
          printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.matrix.auto'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.matrix.auto'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\nrepositories { google(); mavenCentral() }" > ./app/build.gradle

          # 16版修复点：物理注入最小化 AndroidManifest
          printf "<?xml version='1.0' encoding='utf-8'?>\n<manifest xmlns:android='http://schemas.android.com/apk/res/android' package='com.matrix.auto'>\n    <application android:label='AutoMatrix'>\n        <activity android:name='.MainActivity' android:exported='true'>\n            <intent-filter>\n                <action android:name='android.intent.action.MAIN' /><category android:name='android.intent.category.LAUNCHER' />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > ./app/src/main/AndroidManifest.xml

      - name: 4. 设置 Java 环境 (16版保持 Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 自动化构建 APK (16版：物理强隔离构建)
        run: |
          cd workspace
          # 16版修复点：显式下载并使用本地 Wrapper，物理屏蔽系统 gradle 9.4
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          # 物理执行：必须使用 ./gradlew 确保版本锁定
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 6. 归档与版本定义
        uses: actions/upload-artifact@v4
        with:
          name: Video-Matrix-V16-Release
          path: |
            workspace/app/build/outputs/apk/debug/*.apk
