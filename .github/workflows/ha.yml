name: Video-Matrix-APK-Auto-Build-V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  Physical-Audit-and-Build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 物理环境模拟与仓库拉取
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 2. 拉取核心组件 (静默审计模式)
        run: |
          # 物理拉取三个核心组件
          git clone https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git ./core-api
          git clone https://github.com/lonerge/tiktok_youtube_douyin_handling.git ./ui-logic
          git clone https://github.com/yikart/AiToEarn.git ./android-shell

      - name: 3. 逻辑合并与“原文照抄”修复
        run: |
          echo "开始执行 3版 静默审计：正在全盘扫描安卓工程根目录..."
          
          # 定位真正的 Gradle 项目根目录 (物理搜索 settings.gradle)
          PROJECT_ROOT=$(find ./android-shell -name "settings.gradle*" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            echo "错误：未发现合法 Gradle 结构，正在创建物理垫片环境..."
            mkdir -p ./android-shell/app
            touch ./android-shell/settings.gradle
          else
            echo "物理定位成功：$PROJECT_ROOT"
            cd "$PROJECT_ROOT"
          fi

          # 物理移动脚本资源 (维持 2版 逻辑)
          mkdir -p ./src/main/assets/scripts || true
          cp -r ../../ui-logic/* ./src/main/assets/scripts/ || true
          
          # 修复 API 调用地址 (维持 1版 逻辑)
          find . -type f -name "*.java" -exec sed -i 's|localhost:8080|127.0.0.1:2333|g' {} +

      - name: 4. 设置 Android SDK 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 自动化构建 APK (3版修复点：动态定位构建环境)
        run: |
          # 重新定位物理路径
          REAL_PATH=$(find ./android-shell -name "settings.gradle*" | head -n 1 | xargs dirname)
          cd "$REAL_PATH"
          
          # 物理补齐 gradlew 逻辑
          if [ ! -f "gradlew" ]; then
            echo "正在物理生成 Gradle Wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          # 优先尝试 build，如果失败则执行 assembleRelease
          ./gradlew assembleRelease || ./gradlew build

      - name: 6. 归档与版本定义
        uses: actions/upload-artifact@v4
        with:
          name: Video-Matrix-V3-Release
          path: |
            **/*.apk
