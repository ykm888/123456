name: Video-Matrix-APK-Auto-Build-V1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  Physical-Audit-and-Build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 物理环境模拟与仓库拉取
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 2. 拉取核心组件 (静默审计模式)
        run: |
          # 拉取去水印 API 核心 (Python 层)
          git clone https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git ./core-api
          # 拉取 UI 自动化框架 (Auto.js/Hamibot 逻辑)
          git clone https://github.com/lonerge/tiktok_youtube_douyin_handling.git ./ui-logic
          # 拉取 Android 前端壳工程 (Gradle 环境)
          git clone https://github.com/yikart/AiToEarn.git ./android-shell

      - name: 3. 逻辑合并与“原文照抄”修复
        run: |
          echo "开始执行静默审计：确保代码无多余修改，只进行物理路径适配..."
          mkdir -p ./build_output/src/main/assets/scripts
          
          # 将自动化脚本物理移动到安卓工程的资源目录
          cp -r ./ui-logic/* ./build_output/src/main/assets/scripts/
          
          # 修复 API 调用地址 (假设 1 版错误为本地路径不匹配)
          # 仅修复路径错误，不增删功能
          find ./android-shell -type f -name "*.java" -exec sed -i 's|localhost:8080|127.0.0.1:2333|g' {} +

      - name: 4. 设置 Android SDK 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 自动化构建 APK (生成 1 版)
        run: |
          cd ./android-shell
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 6. 归档与版本定义
        uses: actions/upload-artifact@v4
        with:
          name: Video-Matrix-V1-Release
          path: android-shell/app/build/outputs/apk/release/*.apk
